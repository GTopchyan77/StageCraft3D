[FilterPlugin]
; Files listed here are packaged alongside the plugin by RunUAT BuildPlugin
; (and by Epic's Fab build pipeline) IN ADDITION to the standard plugin folders
; (.uplugin, Source/, Config/, Content/, Resources/). Paths are relative to the
; plugin root and may use "...", "*", and "?" wildcards.
;
; This filter is INCLUDE-ONLY (there is no exclude directive). Per Fab TRC,
; all third-party code lives in Source/ThirdParty/ (the two Node packages
; there declare the third-party npm libraries in their package.json files).
; We deliberately ship those sources WITHOUT their node_modules: end users
; run `npm install` per the README (or the plugin self-installs them on
; first editor start). Make sure no node_modules/ directory exists on disk
; when packaging, otherwise a broad glob could vacuum it in.

; --- MCP server (Node, in Source/ThirdParty) — source + manifests only ----
/Source/ThirdParty/unrealngg-mcp/*.js
/Source/ThirdParty/unrealngg-mcp/*.mjs
/Source/ThirdParty/unrealngg-mcp/*.json
/Source/ThirdParty/unrealngg-mcp/*.md
/Source/ThirdParty/unrealngg-mcp/assets/...

; --- Chat sidecar daemon (Node, in Source/ThirdParty) — source + manifests -
/Source/ThirdParty/ngg-sidecar/*.js
/Source/ThirdParty/ngg-sidecar/*.json
/Source/ThirdParty/ngg-sidecar/*.md

; --- bp-extract (pure-Python, stdlib only — no third-party deps) ----------
; First-party Python lives under Content/Python/ per Fab TRC ("Python
; third-party code and libraries should be placed under
; Content/Python/Lib/site-packages/"). bp-extract has NO third-party Python
; dependencies, so there is no Lib/site-packages folder. Content/ is a
; standard plugin folder; the entry below declares the loose (non-uasset)
; files explicitly so no pipeline strips them.
/Content/Python/...

; --- Documentation (custom /Docs folder, linked from README.md) ------------
; User-facing docs only. Maintainer/dev files in Docs/ are deliberately NOT
; shipped and NOT listed here: Docs/FAB_TRC_FIXES.md (internal review log),
; Docs/design/ (HTML sources of the marketing images), Docs/media/
; (screen-capture staging). The packaging script excludes them and verifies
; the staged tree matches this filter exactly.
/Docs/ChatWindow.md
/Docs/Tutorial.md
/Docs/ReviewerTesting.md
/Docs/images/...

; --- Top-level docs -------------------------------------------------------
; THIRD_PARTY_NOTICES.md is deliberately NOT shipped: no third-party code is
; distributed with the plugin (npm dependencies are fetched by the end user
; via `npm install`), and Fab review flags license-related files in the
; package. The notices file stays in the source repo for attribution.
; Dev-only artifacts are likewise not shipped/listed: Source/ThirdParty/
; gen-*.mjs (icon/notice generators), .npmignore, .gitignore.
/README.md
/TRANSFER_GUIDE.md
