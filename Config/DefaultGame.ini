[/Script/ModularSceneBuilder.StageEconomySubsystem]
; Empty = offline UStageLocalCommerceBackend. StageCloudCommerceBackend settles real-money listings through StageCraft Cloud while
; signed in (ADR 0032 §6) and everything else exactly as the local backend does; with no Cloud BaseUrl it is the local backend.
CommerceBackendClass=/Script/ModularSceneBuilder.StageCloudCommerceBackend

[/Script/ModularSceneBuilder.StageMarketplaceSubsystem]
; Community marketplace (Docs/ADR/0021-community-marketplace.md §3). Empty = UStageLocalMarketplaceBackend (a community folder).
; StageCloudMarketplaceBackend uses StageCraft Cloud when its BaseUrl is set and the community folder otherwise (ADR 0032 §6).
MarketplaceBackendClass=/Script/ModularSceneBuilder.StageCloudMarketplaceBackend

[/Script/ModularSceneBuilder.StageCloudSubsystem]
; StageCraft Cloud (Docs/ADR/0032). Empty = offline: no account, no real-money sales, nothing is ever sent. https only, except
; http://127.0.0.1 / localhost for a development server (Services/StageCraftCloud, AUTH_MODE=dev).
BaseUrl=
RequestTimeoutSeconds=30

[/Script/ModularSceneBuilder.StageLocalMarketplaceBackend]
; Absolute path of the community folder (a shared network folder makes a LAN showcase). Empty = Saved/StageCraft/Marketplace/Community.
CommunityDirectory=

[/Script/ModularSceneBuilder.StageMeshImportSubsystem]
; Library thumbnails of imported models (Docs/ADR/0006-inspector-polish-and-runtime-model-import.md).
ThumbnailMaterial=/Game/StageCraft/UI/Thumbnails/M_ThumbnailClay.M_ThumbnailClay

[/Script/ModularSceneBuilder.LightingFixtureActor]
; Light-function material that projects gobos, iris, blades, barndoors, prisms and frost (Docs/ADR/0007 §5.2, Docs/ADR/0020 §4).
BeamShapingMaterial=/Game/StageCraft/Lighting/M_StageBeamLightFunction.M_StageBeamLightFunction
; Lens and pixel-cell glow (Docs/ADR/0020 §4; Scripts/Content/create_fixture_library_content.py).
EmitterMaterial=/Game/StageCraft/Lighting/M_StageFixtureEmitter.M_StageFixtureEmitter
LensMesh=/Engine/BasicShapes/Cylinder.Cylinder
CellStripMesh=/Engine/BasicShapes/Plane.Plane

[/Script/ModularSceneBuilder.StageLightingSettings]
; Gel library for the inspector's Gel picker and the assistant, built from Scripts/Content/Data/StageGels.csv (Docs/ADR/0020 §3).
GelTable=/Game/StageCraft/Lighting/DT_StageGels.DT_StageGels

[/Script/ModularSceneBuilder.StageViewportComponent]
; CAD line view post-process material, blended in only in the viewport's Lines mode (Docs/ADR/0008-viewport-toolbar-projections-and-view-modes.md §4.3).
LineViewMaterial=/Game/StageCraft/Viewport/M_StageLineView.M_StageLineView

[/Script/ModularSceneBuilder.StageGridActor]
; Reference grid material: analytic anti-aliased lines that stay stable under TSR (STATE.md #48, Scripts/Content/create_grid_content.py).
GridMaterial=/Game/StageCraft/Viewport/M_StageGrid.M_StageGrid

[/Script/ModularSceneBuilder.StageEnvironmentSubsystem]
; Sky backend of the outdoor environment (Docs/ADR/0009-outdoor-environment.md). Empty = no outdoor sky; the panel says so.
BackendClass=/Script/StageCraftSkyCreator.StageSkyCreatorBackend
; Studio lighting's HDRI sky (Docs/ADR/0024 §4), loaded asynchronously; empty or missing = a flat neutral light. Cooked via DirectoriesToAlwaysCook.
StudioCubemap=/Engine/MapTemplates/Sky/DaylightAmbientCubemap.DaylightAmbientCubemap
; Seconds an atmosphere preset takes to blend in (ADR 0024 §5).
BlendSeconds=2.0

[/Script/ModularSceneBuilder.StagePowerDistributionSettings]
; Supply the cable schedule plans for (Project Settings > Game > StageCraft Power Distribution; Docs/ADR/0012 §2.3).
PhaseVoltage=230.000000
Phases=Three
CircuitRatingAmps=16.000000
UsablePercent=80.000000
PowerFactor=1.000000

[/Script/UnrealEd.ProjectPackagingSettings]
; Referenced only from config (soft paths above), so the cooker would not find them on its own.
+DirectoriesToAlwaysCook=(Path="/Game/StageCraft/Placement")

+DirectoriesToAlwaysCook=(Path="/Game/StageCraft/UI/Thumbnails")
+DirectoriesToAlwaysCook=(Path="/Game/StageCraft/Lighting")
+DirectoriesToAlwaysCook=(Path="/Game/StageCraft/Viewport")
; Parent materials of imported models: Interchange creates material instances of these at runtime (ADR 0006).
+DirectoriesToAlwaysCook=(Path="/InterchangeAssets/Materials")
+DirectoriesToAlwaysCook=(Path="/InterchangeAssets/gltf")
; Sky Creator's sky actor finds its materials, effects, meshes, curves and default weather preset by path in C++ (ADR 0009 §5).
; Its Demo, Maps and Sounds folders are not used by the actor and stay out of the package.
+DirectoriesToAlwaysCook=(Path="/SkyCreatorPlugin/Curves")
+DirectoriesToAlwaysCook=(Path="/SkyCreatorPlugin/Effects")
+DirectoriesToAlwaysCook=(Path="/SkyCreatorPlugin/Materials")
+DirectoriesToAlwaysCook=(Path="/SkyCreatorPlugin/Meshes")
+DirectoriesToAlwaysCook=(Path="/SkyCreatorPlugin/Textures")
+DirectoriesToAlwaysCook=(Path="/SkyCreatorPlugin/WeatherPresets")
; The sky actor's UVolumetricCloudComponent loads its engine default material by path when it is created (VolumetricCloudComponent.cpp),
; before Sky Creator swaps in its own. Nothing else references it, so without this the packaged game logs it as missing (ADR 0010 §7).
+DirectoriesToAlwaysCook=(Path="/Engine/EngineSky/VolumetricClouds")
; The studio rig's HDRI sky (StudioCubemap above, ADR 0024 §4).
+DirectoriesToAlwaysCook=(Path="/Engine/MapTemplates/Sky")
; Starter stages: scene JSON read through the scene parser at runtime (ADR 0024 §6). Not assets, so staged as files in the pak.
+DirectoriesToAlwaysStageAsUFS=(Path="StageCraft/Templates")
; Help articles of the assistant: Markdown read through the knowledge index at runtime (ADR 0030 section 3), staged as files in the pak.
+DirectoriesToAlwaysStageAsUFS=(Path="StageCraft/Help")
