[/Script/UnrealEd.ProjectPackagingSettings]
; Referenced only from config (soft paths above), so the cooker would not find them on its own.
+DirectoriesToAlwaysCook=(Path="/Game/StageCraft/Audio")
+DirectoriesToAlwaysCook=(Path="/Game/StageCraft/Placement")

+DirectoriesToAlwaysCook=(Path="/Game/StageCraft/UI/Thumbnails")
+DirectoriesToAlwaysCook=(Path="/Game/StageCraft/Lighting")
+DirectoriesToAlwaysCook=(Path="/Game/StageCraft/Viewport")
; Parent materials of imported models: Interchange creates material instances of these at runtime (ADR 0006).
+DirectoriesToAlwaysCook=(Path="/InterchangeAssets/Materials")
+DirectoriesToAlwaysCook=(Path="/InterchangeAssets/gltf")
; Sky Creator's sky actor finds its materials, effects, meshes, curves and default weather preset by path in C++ (ADR 0009 §5).
; Its Demo, Maps and Sounds folders are not used by the actor and stay out of the package.
+DirectoriesToAlwaysCook=(Path="/SkyCreatorPlugin/Curves")
+DirectoriesToAlwaysCook=(Path="/SkyCreatorPlugin/Effects")
+DirectoriesToAlwaysCook=(Path="/SkyCreatorPlugin/Materials")
+DirectoriesToAlwaysCook=(Path="/SkyCreatorPlugin/Meshes")
+DirectoriesToAlwaysCook=(Path="/SkyCreatorPlugin/Textures")
+DirectoriesToAlwaysCook=(Path="/SkyCreatorPlugin/WeatherPresets")
; The sky actor's UVolumetricCloudComponent loads its engine default material by path when it is created (VolumetricCloudComponent.cpp),
; before Sky Creator swaps in its own. Nothing else references it, so without this the packaged game logs it as missing (ADR 0010 §7).
+DirectoriesToAlwaysCook=(Path="/Engine/EngineSky/VolumetricClouds")
