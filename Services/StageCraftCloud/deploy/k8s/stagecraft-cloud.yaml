# StageCraft Cloud on EKS (ADR 0032 §4, D7). Nothing here is applied by the repository; see docs/RUNBOOK.md.
# Placeholders to replace: <ACCOUNT_ID>, <REGION>, <CERT_ARN>, cloud.example.com, the image tag.
# Prerequisites in the cluster: AWS Load Balancer Controller, External Secrets Operator (with a ClusterSecretStore named
# "aws-secrets-manager"), metrics-server (for the HPA), a CNI that enforces NetworkPolicy, and EKS Pod Identity (or IRSA)
# granting the "stagecraft-cloud" service account s3:GetObject/PutObject/DeleteObject on the package bucket.
apiVersion: v1
kind: Namespace
metadata:
  name: stagecraft
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stagecraft-cloud
  namespace: stagecraft
  annotations:
    # Only for IRSA; with EKS Pod Identity create the association instead (docs/RUNBOOK.md).
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/stagecraft-cloud
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stagecraft-cloud
  namespace: stagecraft
data:
  NODE_ENV: production
  PORT: "8080"
  PUBLIC_BASE_URL: https://cloud.example.com
  LOG_LEVEL: info
  TRUST_PROXY_HOPS: "1"
  MIGRATE_ON_START: "false"
  AUTH_MODE: oidc
  OIDC_SCOPES: openid email profile
  PAYMENT_PROVIDER: stripe
  STRIPE_AUTOMATIC_TAX: "false"
  STRIPE_PLATFORM_COUNTRY: US
  SETTLEMENT_CURRENCIES: USD
  SELLER_SHARE_BPS: "8500"
  PAYOUT_HOLD_DAYS: "14"
  CHECKOUT_EXPIRES_MINUTES: "30"
  BLOB_STORE: s3
  S3_REGION: <REGION>
  S3_BUCKET: stagecraft-cloud-packages
  DOWNLOAD_URL_TTL_SECONDS: "300"
---
# Secrets come from AWS Secrets Manager (secret "stagecraft/cloud", a JSON object) through External Secrets.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: stagecraft-cloud
  namespace: stagecraft
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: stagecraft-cloud
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: stagecraft/cloud, property: DATABASE_URL }
    - secretKey: STRIPE_SECRET_KEY
      remoteRef: { key: stagecraft/cloud, property: STRIPE_SECRET_KEY }
    - secretKey: STRIPE_WEBHOOK_SECRETS
      remoteRef: { key: stagecraft/cloud, property: STRIPE_WEBHOOK_SECRETS }
    - secretKey: OIDC_ISSUER
      remoteRef: { key: stagecraft/cloud, property: OIDC_ISSUER }
    - secretKey: OIDC_CLIENT_ID
      remoteRef: { key: stagecraft/cloud, property: OIDC_CLIENT_ID }
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef: { key: stagecraft/cloud, property: OIDC_CLIENT_SECRET }
---
# Migrations run once per release, before the Deployment rolls (docs/RUNBOOK.md, "Deploy"). Delete the finished Job before the
# next release, or let ttlSecondsAfterFinished remove it.
apiVersion: batch/v1
kind: Job
metadata:
  name: stagecraft-cloud-migrate
  namespace: stagecraft
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stagecraft-cloud
        app.kubernetes.io/component: migrate
    spec:
      serviceAccountName: stagecraft-cloud
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/stagecraft-cloud:0.1.0
          command: ["node", "src/cli.ts", "migrate"]
          envFrom:
            - configMapRef: { name: stagecraft-cloud }
            - secretRef: { name: stagecraft-cloud }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stagecraft-cloud
  namespace: stagecraft
  labels:
    app.kubernetes.io/name: stagecraft-cloud
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: stagecraft-cloud
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stagecraft-cloud
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: stagecraft-cloud
      # Long polls last up to 25 s; SIGTERM closes the listener and waits for them.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: stagecraft-cloud, app.kubernetes.io/component: api }
      containers:
        - name: api
          image: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/stagecraft-cloud:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
          envFrom:
            - configMapRef: { name: stagecraft-cloud }
            - secretRef: { name: stagecraft-cloud }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          lifecycle:
            # Give the ALB time to deregister the pod before the process stops accepting connections.
            preStop:
              sleep: { seconds: 10 }
          resources:
            # Uploads hold a package (up to 96 MiB) in memory while it is validated.
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: stagecraft-cloud
  namespace: stagecraft
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: stagecraft-cloud
    app.kubernetes.io/component: api
  ports:
    - { name: http, port: 80, targetPort: http, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stagecraft-cloud
  namespace: stagecraft
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: <CERT_ARN>
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /readyz
    # Package uploads are up to 96 MiB and long polls up to 25 s.
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=60,routing.http.drop_invalid_header_fields.enabled=true
    # Optional: attach a WAF web ACL with a rate-based rule as the cluster-wide rate limit (the service's limits are per pod).
    # alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:<REGION>:<ACCOUNT_ID>:regional/webacl/stagecraft/...
spec:
  ingressClassName: alb
  rules:
    - host: cloud.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stagecraft-cloud
                port: { name: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stagecraft-cloud
  namespace: stagecraft
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stagecraft-cloud
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: stagecraft-cloud
  namespace: stagecraft
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stagecraft-cloud
      app.kubernetes.io/component: api
---
# Ingress only from inside the VPC (the ALB targets pod IPs); egress only to DNS and HTTPS (Stripe, the identity provider, S3,
# STS, Secrets Manager) and Postgres. Replace 10.0.0.0/16 with the VPC CIDR.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stagecraft-cloud
  namespace: stagecraft
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stagecraft-cloud
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock: { cidr: 10.0.0.0/16 }
      ports:
        - { port: 8080, protocol: TCP }
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - ipBlock: { cidr: 10.0.0.0/16 }
      ports:
        - { port: 5432, protocol: TCP }
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { port: 443, protocol: TCP }
    # EKS Pod Identity agent (link-local).
    - to:
        - ipBlock: { cidr: 169.254.170.23/32 }
      ports:
        - { port: 80, protocol: TCP }
